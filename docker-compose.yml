name: medihub

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: medihub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medihub
    volumes:
      - medihub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medihub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: medihub-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/medihub?schema=public
      CLIENT_ORIGIN: "http://localhost:8081,http://localhost:5173"
      JWT_SECRET: change-me-to-a-long-random-string-in-production
      PORT: "5000"
      MAIL_FROM: "MediHub Pakistan <no-reply@medihub.pk>"
      # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS: leave unset to log emails to the container log
    volumes:
      - ./data/files:/app/data/files
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: medihub-web
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - api

volumes:
  medihub_pgdata:
